name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: unit tests
        run: node _test.js
      - name: jsdom smoke
        run: |
          npm install --no-save jsdom
          node smoke.js
