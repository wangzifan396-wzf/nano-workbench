<style>

  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.3px;}
  .brand .dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--acc),#8b94f0);
    display:flex;align-items:center;justify-content:center;font-size:13px;}
  .brand small{color:var(--txt3);font-weight:500;}
  .spacer{flex:1;}
  .search{flex:1;max-width:420px;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:8px 12px;font-size:13.5px;outline:none;}
  .search:focus{border-color:var(--acc);}
  .lang-btn{background:var(--card2);border:1px solid var(--line);color:var(--txt2);border-radius:8px;
    padding:6px 12px;cursor:pointer;font-size:13px;}
  .lang-btn:hover{border-color:var(--line2);color:var(--txt);}

  .layout{display:flex;height:calc(100% - 53px);min-height:0;}
  .side{width:268px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:10px;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}

  .cat-h{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt3);
    margin:12px 8px 6px;font-weight:700;}
  .tool{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;}
  .tool:hover{background:var(--card);border-color:var(--line);}
  .tool.active{background:var(--card2);border-color:var(--line2);}
  .tool svg{width:20px;height:20px;flex:none;color:var(--acc);}
  .tool .nm{font-weight:600;font-size:13.5px;}
  .tool .ds{color:var(--txt3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tool .col{flex:1;min-width:0;}

  .tabs{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto;
    background:var(--card);}
  .tab{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;cursor:pointer;
    background:var(--card2);border:1px solid var(--line);color:var(--txt2);font-size:13px;white-space:nowrap;}
  .tab:hover{border-color:var(--line2);}
  .tab.active{background:var(--bg);color:var(--txt);border-color:var(--acc);}
  .tab .x{color:var(--txt3);font-size:14px;line-height:1;padding:0 2px;}
  .tab .x:hover{color:var(--err,#EF4444);}
  .tab .ext{color:var(--txt3);font-size:11px;}

  .frame-wrap{flex:1;min-height:0;position:relative;background:var(--bg);}
  iframe{width:100%;height:100%;border:none;background:#fff;display:none;}
  iframe.show{display:block;}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--txt3);gap:10px;}
  .empty .big{font-size:17px;color:var(--txt2);}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--card2);border:1px solid var(--line2);padding:10px 18px;border-radius:10px;
    opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:14px;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media(max-width:760px){.layout{flex-direction:column;}.side{width:auto;max-height:38vh;border-right:none;border-bottom:1px solid var(--line);}}

var BASE = "https://wangzifan396-wzf.github.io/WB/tools/";
function buildDemoUrl(id){ return BASE + id + "/"; }
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function filterTools(tools, q, cat){
  q=String(q||'').trim().toLowerCase();
  return tools.filter(function(t){
    if(cat && cat!=='全部' && t.cat!==cat) return false;
    if(!q) return true;
    var hay=(t.name+' '+t.desc+' '+(t.tags||[]).join(' ')).toLowerCase();
    return hay.indexOf(q)>=0;
  });
}
function groupByCat(tools){
  var g={};
  tools.forEach(function(t){ (g[t.cat]=g[t.cat]||[]).push(t); });
  return g;
}
function catsOf(tools){
  var s={}; tools.forEach(function(t){ s[t.cat]=1; });
  return Object.keys(s);
}

/* ---------- 导出（node 单测用） ---------- */

}

  function iconSvg(k){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[k]||"")+'</svg>'; }

  var I18N={
    zh:{pick:'从左侧选择一个工具开始',hint:'所有工具都在一个标签页里即时切换，无需反复打开新页面。',
        search:'搜索工具…',ext:'新标签',toastOpen:'已打开：',newtab:'在新标签打开'},
    en:{pick:'Pick a tool from the left to start',hint:'All tools switch instantly in one tab — no more reopening pages.',
        search:'Search tools…',ext:'new tab',toastOpen:'Opened: ',newtab:'Open in new tab'}
  };
  var lang=localStorage.getItem('wb_lang')||'zh';
  var $=function(id){return document.getElementById(id);};
  var t=function(k){return (I18N[lang]&&I18N[lang][k])||k;};
  var tabs=[]; // [{id,name}]
  var activeId=null;

  function applyLang(){
    document.documentElement.lang=lang==='zh'?'zh-CN':'en';
    document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.dataset.i18n);});
    $('search').placeholder=t('search');
    $('langBtn').textContent=lang==='zh'?'EN':'中';
    document.title=lang==='zh'?'nano-workbench · 工具工作台':'nano-workbench · Tool Workbench';
  }
  var toastTimer;
  function toast(msg){ $('toast').textContent=msg;$('toast').classList.add('show');
    clearTimeout(toastTimer);toastTimer=setTimeout(function(){$('toast').classList.remove('show');},1700); }

  function renderSide(){
    var q=$('search').value;
    var list=filterTools(TOOLS, q, '全部');
    var grouped=groupByCat(list);
    var side=$('side'); side.innerHTML='';
    catsOf(list).forEach(function(cat){
      var h=document.createElement('div');h.className='cat-h';h.textContent=cat;side.appendChild(h);
      grouped[cat].forEach(function(tool){
        var el=document.createElement('div');
        el.className='tool'+(tool.id===activeId?' active':'');
        el.innerHTML=iconSvg(tool.icon)+'<div class="col"><div class="nm">'+escapeHTML(tool.name)+
          '</div><div class="ds">'+escapeHTML(tool.desc)+'</div></div>';
        el.addEventListener('click',function(){openTool(tool.id);});
        side.appendChild(el);
      });
    });
  }

  function frameFor(id){
    var f=$('frame-'+id);
    if(!f){
      f=document.createElement('iframe');
      f.id='frame-'+id; f.className='frame'; f.src=buildDemoUrl(id);
      f.setAttribute('loading','lazy');
      $('frameWrap').appendChild(f);
    }
    return f;
  }

  function renderTabs(){
    var bar=$('tabs'); bar.innerHTML='';
    tabs.forEach(function(tab){
      var el=document.createElement('div');
      el.className='tab'+(tab.id===activeId?' active':'');
      el.innerHTML='<span>'+escapeHTML(tab.name)+'</span>'+
        '<span class="ext" title="'+t('newtab')+'">⧉</span>'+
        '<span class="x" title="close">×</span>';
      el.addEventListener('click',function(e){
        if(e.target.classList.contains('x')){ closeTab(tab.id); }
        else if(e.target.classList.contains('ext')){ window.open(buildDemoUrl(tab.id),'_blank'); }
        else { activate(tab.id); }
      });
      bar.appendChild(el);
    });
  }

  function activate(id){
    activeId=id;
    // show only active frame
    document.querySelectorAll('.frame').forEach(function(f){ f.classList.remove('show'); });
    frameFor(id).classList.add('show');
    $('empty').style.display='none';
    renderTabs(); renderSide();
  }

  function openTool(id){
    if(!tabs.some(function(x){return x.id===id;})){
      var tool=TOOLS.find(function(x){return x.id===id;});
      tabs.push({id:id, name:tool.name});
      toast(t('toastOpen')+tool.name);
    }
    activate(id);
  }

  function closeTab(id){
    tabs=tabs.filter(function(x){return x.id!==id;});
    var f=$('frame-'+id); if(f) f.remove();
    if(activeId===id){ activeId=tabs.length?tabs[tabs.length-1].id:null; }
    if(activeId){ activate(activeId); }
    else { document.querySelectorAll('.frame').forEach(function(f){f.classList.remove('show');}); $('empty').style.display='flex'; renderTabs(); renderSide(); }
  }

  $('search').addEventListener('input',renderSide);
  $('langBtn').addEventListener('click',function(){lang=lang==='zh'?'en':'zh';localStorage.setItem('wb_lang',lang);applyLang();});

  applyLang();
  renderSide();
  renderTabs();
}
</script>
